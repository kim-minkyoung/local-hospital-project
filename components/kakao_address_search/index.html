<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    button {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #dce3df;
      border-radius: 8px;
      background: #0f5b4c;
      color: #fff;
      font: 700 14px sans-serif;
      cursor: pointer;
    }
    button:hover { background: #0a3f35; }
  </style>
</head>
<body>
  <button id="addr-search-btn" type="button">📮 주소검색 팝업 열기</button>
  <script>
    function sendToStreamlit(type, data) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, data || {}),
        "*"
      );
    }

    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    sendToStreamlit("streamlit:setFrameHeight", { height: 42 });

    document.getElementById("addr-search-btn").addEventListener("click", function () {
      new daum.Postcode({
        oncomplete: function (data) {
          const address = data.roadAddress || data.jibunAddress;
          sendToStreamlit("streamlit:setComponentValue", {
            value: { address: address, selectionId: Date.now() },
            dataType: "json"
          });
        }
      }).open();
    });
  </script>
</body>
</html>
